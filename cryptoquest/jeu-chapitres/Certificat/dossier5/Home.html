<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="/cryptoquest/jeu-chapitres/Certificat/dossier5/B_logo_site.png">
    <link type="text/css" rel="stylesheet" href= '/cryptoquest/jeu-chapitres/Certificat/dossier5/home_hidden.css' >

<body>
    <div class="white">
        <div class="black">
            <div class="white">
                <div class="black">
                    <div class="white">
                        <div class="black">
                            <div class="white">
                                <div class="centre">
                                <section id="Titre">
                                    Bienvenue sur mon site! Mais attention, accès réservé aux VIP!
                                </section>

                                <form id="login-form">
                                    <!--Vous êtes admin ou vous l'êtes pas! Comment être VIP sans être admin...-->
                                    Login : <input type="text" name="login" id="login-field"><br>
                                    <!-- L'artichaut a la réponse-->
                                    Mot de passe : <input type="password" name="mdp" id="mdp-field"><br>
                                    <input type="submit" value="submit">
                                </form>
                                <script>
                                    document.getElementById('login-form').addEventListener('submit', function (e) {
                                        e.preventDefault();
                                        var login = document.getElementById('login-field').value;
                                        var mdp = document.getElementById('mdp-field').value;
                                        if (login === "admin" && mdp === "5FruitsEtLegumes") {
                                            window.location.href = "/cryptoquest/jeu-chapitres/Certificat/dossier5/secret-site/home.html";
                                        } else {
                                            alert("Identifiants incorrects.");
                                        }
                                    });
                                </script>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
